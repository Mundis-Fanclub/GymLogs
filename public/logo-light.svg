  <title id="title">Logged Gym App Logo</title>
  <desc id="desc">Modern centered fitness app logo with neon green L, barbell icon, progress ring and Logged wordmark.</desc>

  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB266"/>
      <stop offset="55%" stop-color="#FF8A2A"/>
      <stop offset="100%" stop-color="#D45F00"/>
    </linearGradient>

    <linearGradient id="grayGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B5B5B"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

